name: Validate and package extension
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: code-coloring-extension
          path: artifacts/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-screenshots
          path: test-results/*.png
          if-no-files-found: ignore

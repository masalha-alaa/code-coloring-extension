<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code Coloring</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><span class="mark">&lt;/&gt;</span><div><h1>Code Coloring</h1><p>Local files, easier to read.</p></div></header>
  <p id="notice" role="status" aria-live="polite">Checking this tab…</p>
  <section id="controls" hidden>
    <p id="filename"></p>
    <label for="language">Language</label><select id="language"></select>
    <label id="pretty-label" class="check" hidden><input id="pretty" type="checkbox">Pretty format JSON</label>
    <label class="check"><input id="wrap" type="checkbox">Wrap long lines</label>
    <button id="reset" type="button">Reset this file’s view</button>
  </section>
  <button id="settings" type="button" hidden>Open extension settings</button>
  <button id="reload" type="button" hidden>Reload this tab</button>
  <footer>Viewing only · Offline · Files stay unchanged</footer>
  <script src="popup.js"></script>
</body></html>
